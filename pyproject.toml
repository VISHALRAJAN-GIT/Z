[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tamil-voice-foundation"
version = "0.1.0"
description = "Compact, offline, low-latency Tamil voice intelligence foundation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "PyYAML>=6.0",
    "pydantic>=2.5",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Torch is optional so the audio foundation can be developed and tested without
# pulling ~2.5 GB of wheels. Install the CPU or CUDA build explicitly:
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu124
torch = [
    "torch>=2.2",
    "torchaudio>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tamil_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: long running tests",
    "model: tests that instantiate neural models",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["tamil_voice"]
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["src/tamil_voice"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]